<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Planificacion del curso</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>Planificación del curso</h1>

      <form class="form" id="formulario">
        <div class="form-row">
          <input id="texto" type="text" placeholder="¿Qué has hecho hoy?" />
          <input
            id="tiempo"
            type="number"
            min="0"
            placeholder="Min"
            aria-label="Tiempo en minutos"
          />
        </div>
        <button id="añadir" type="submit">Añadir</button>
      </form>

      <ul id="lista" aria-live="polite"></ul>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
